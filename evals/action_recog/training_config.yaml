device: "cuda:0"
seed: 42

dataset_config_path: "/home/rvm/evals/action_recog/dataset_config.yaml"
restored_params_path: "/home/rvm/rvm_repr_finetune.npz" # finetuned
# restored_params_path: "/home/rvm/rvm_ckpts/pretrain_rvm_small16_256_204031069.npz"
# restored_params_path: "/home/rvm/repre_finetuned.npz"

# Optimization fixed across all tasks/models (4D scaling paper, Carreira et al.):
# 1.28M training examples, batch size 32 -> 40k steps, AdamW, wd 1e-4,
# LR swept over {1e-4, 3e-4, 1e-3}, 1k-step linear warmup, cosine decay to 1e-7.
lr: 3.0e-4
weight_decay: 1.0e-4
betas: [0.9, 0.999]
eps: 1.0e-8

warmup_ratio: 0.05
min_lr: 1.0e-7

num_epochs: 2
batch_size: 64
num_workers: 16
amp: true

log_interval: 200
eval_interval: 1000
checkpoint_dir: "checkpoints_ssv2_acr_representation"

wandb_project: "rvm-action-recog"
wandb_name: "ssv2-readout-run1"

# SSv2 readout head (paper supp. Table 6)
readout_in_dim: 384
readout_dim: 768
readout_num_heads: 12
readout_num_classes: 174
