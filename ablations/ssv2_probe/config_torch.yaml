# model params copied verbatim from configs/train_ema.yaml
model:
  encoder_name: facebook/dinov2-small
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 3
  dec_heads: 16
  dec_mlp: 768
  mask_ratio: 1
  max_delta: 64
  freeze_encoder: True
  checkpoint_core: false

