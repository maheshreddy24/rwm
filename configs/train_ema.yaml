seed: 42

model:
  encoder_name: facebook/dinov2-with-registers-small
  # encoder_name: facebook/dinov2-small
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 3
  dec_heads: 16
  dec_mlp: 768
  objective: repr
  pixel_recon: False


dataset:
  train:
    manifest: /home/rvm/datasets/train_manifest.csv
    context_frames: 5
    min_stride: 5 
    max_stride: 10
    target_frames: 5
    target_min_stride: 30
    target_max_stride: 40

    min_duration_frames: 250
    frame_size: [252, 252]   # must match encoder patch_size (14) so H/patch is an integer grid
    # Keyed by the `source` column in the manifest.
    sources:
      ssv2:
        mode: single
        weight: 1.0
        target_min_stride: 8
        target_max_stride: 10
        min_duration_frames: 75
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 250
        weight: 1.0
        # max_windows: 40   # optional cap per videos
    default_source:
      mode: single
      weight: 1.0
  eval:
    manifest: /home/rvm/datasets/test_manifest.csv
    frame_size: [252, 252]
    context_frames: 5
    min_stride: 5
    max_stride: 10
    target_frames: 3
    target_min_stride: 30
    target_max_stride: 40
    min_duration_frames: 250
    deterministic: false
    sources:
      ssv2:
        mode: single
        weight: 1.0
        target_min_stride: 8
        target_max_stride: 10
        min_duration_frames: 75
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 250
        weight: 1.0
    default_source:
      mode: single
      weight: 1.0

dataloader:
  batch_size: 96
  num_workers: 15
  pin_memory: true
  prefetch_factor: 4

trainer:
  checkpoint_dir: checkpoints/checkpoints_rwm
  lr: 1.5e-4          # recurrent core + decoder + repr_head
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  min_context: 5 # rwm

  num_epochs: 8
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

  normalize_target: false

  save_every_steps: 300
  eval_every_steps: 300

  amp: true
  log_interval: 100

  wandb_project: rwm
  wandb_name: null
