seed: 42

model:
  encoder_name: facebook/dinov2-small
  # encoder_name: facebook/dinov2-with-registers-small
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 3
  dec_heads: 16
  dec_mlp: 768
  # mask_ratio: 0.95
  # mask_ratio: 1
  # max_delta: 64
  # freeze_encoder: True
  # checkpoint_core: false

dataset:
  train:
    video_csv: /home/rvm/datasets/train_dataset_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 4
    max_delta: 48
    min_delta: 20
    frame_size: [256, 256]   # must match encoder patch_size (14) so H/patch is an integer grid
  eval:
    video_csv: /home/rvm/datasets/test_dataset_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 4
    max_delta: 48
    min_delta: 20
    frame_size: [256, 256]

dataloader:
  batch_size: 32
  num_workers: 15
  pin_memory: true
  prefetch_factor: 4

trainer:
  checkpoint_dir: checkpoints/checkpoints_rwm
  lr: 1.5e-4          # recurrent core + decoder + repr_head
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  min_context: 10 # rwm

  num_epochs: 8
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

  normalize_target: true

  save_every_steps: 500
  eval_every_steps: 500

  amp: true
  log_interval: 200

  wandb_project: rvm_dino
  wandb_name: null
