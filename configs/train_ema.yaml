seed: 42

model:
  encoder_name: facebook/dinov2-with-registers-small
  # encoder_name: facebook/dinov2-small
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 3
  dec_heads: 16
  dec_mlp: 768
  objective: pixel
  pixel_recon: True
  # mask_ratio: 0.95
  # mask_ratio: 1
  # max_delta: 64
  # freeze_encoder: True
  # checkpoint_core: false

dataset:
  train:
    manifest: /home/rvm/datasets/train_manifest.csv
    roll_out: 16
    max_stride: 3
    min_duration_frames: 48
    frame_size: [252, 252]   # must match encoder patch_size (14) so H/patch is an integer grid
    # Keyed by the `source` column in the manifest.
    sources:
      ssv2:
        mode: single
        weight: 1.0
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 180
        weight: 1.0
        # max_windows: 40   # optional cap per video
    default_source:
      mode: single
      weight: 1.0
  eval:
    manifest: /home/rvm/datasets/test_manifest.csv
    roll_out: 16
    frame_size: [252, 252]
    max_stride: 5
    min_duration_frames: 80
    deterministic: true
    sources:
      ssv2:
        mode: single
        weight: 1.0
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 180
        weight: 1.0
    default_source:
      mode: single
      weight: 1.0

dataloader:
  batch_size: 64
  num_workers: 15
  pin_memory: true
  prefetch_factor: 4

trainer:
  checkpoint_dir: checkpoints/checkpoints_rwm
  lr: 1.5e-4          # recurrent core + decoder + repr_head
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  min_context: 10 # rwm

  num_epochs: 8
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

  normalize_target: true

  save_every_steps: 1000
  eval_every_steps: 2000

  amp: true
  log_interval: 200

  wandb_project: rwm
  wandb_name: null
