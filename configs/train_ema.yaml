seed: 42

model:
  variant: base
  context_mode: state
  preserve_ratio: 0.2


dataset:
  train:
    manifest: /home/rvm/datasets/train_manifest.csv
    context_frames: 5
    min_stride: 0.2  # seconds
    max_stride: 0.4  # seconds
    target_frames: 5
    target_min_stride: 0.8  # seconds
    target_max_stride: 1.0  # seconds

    frame_size: [252, 252]   # must match encoder patch_size (14) so H/patch is an integer grid
    # Keyed by the `source` column in the manifest.
    sources:
      ssv2:
        mode: single
        weight: 1.0
        target_min_stride: 0.2  # seconds; ssv2 clips run ~3s, too short for the default target stride
        target_max_stride: 0.3  # seconds
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 250
        weight: 1.0
        # max_windows: 40   # optional cap per videos
    default_source:
      mode: single
      weight: 1.0
  eval:
    manifest: /home/rvm/datasets/test_manifest.csv
    frame_size: [252, 252]
    context_frames: 5
    min_stride: 0.2  # seconds
    max_stride: 0.4  # seconds
    target_frames: 3
    target_min_stride: 0.8  # seconds
    target_max_stride: 1.0  # seconds
    deterministic: true
    sources:
      ssv2:
        mode: single
        weight: 1.0
        target_min_stride: 0.2  # seconds
        target_max_stride: 0.3  # seconds
      kinetics:
        mode: single
        weight: 1.0
      ego4d:
        mode: segment
        segment_seconds: 250
        weight: 1.0
    default_source:
      mode: single
      weight: 1.0

dataloader:
  batch_size: 24
  num_workers: 15
  pin_memory: true
  prefetch_factor: 4

trainer:
  checkpoint_dir: checkpoints/checkpoints_rwm_base
  lr: 1.5e-4          # recurrent core + decoder + repr_head
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0

  num_epochs: 8
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

  normalize_target: false

  save_every_steps: 2000
  eval_every_steps: 6000
  

  amp: true
  log_interval: 100

  wandb_project: rwm
  wandb_name: null
