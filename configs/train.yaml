seed: 42

model:
  encoder_name: facebook/dinov2-small
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 8
  dec_heads: 16
  dec_mlp: 2048
  mask_ratio: 0.95
  max_delta: 64
  freeze_encoder: false
  checkpoint_core: false

# train_csv = "/home/geometric-ssl/dataset/somethingv2/20b_ssv2_train.csv"
# test_csv = "/home/geometric-ssl/dataset/somethingv2/20b_ssv2_test.csv"
# 
dataset:
  train:
    video_csv: /home/geometric-ssl/dataset/somethingv2/20b_ssv2_train.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 64
    frame_size: [224, 224]   # must match encoder patch_size (14) so H/patch is an integer grid
    min_duration_sec: 4
  eval:
    video_csv: /home/geometric-ssl/dataset/somethingv2/20b_ssv2_test.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 64
    frame_size: [224, 224]
    min_duration_sec: 4

dataloader:
  batch_size: 64
  num_workers: 4
  pin_memory: true

trainer:
  checkpoint_dir: checkpoints
  lr: 1.5e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  num_epochs: 100
  warmup_epochs: 5
  min_lr: 1e-6
  masked_only: false
  norm_pix: false
  amp: true
  log_interval: 50
