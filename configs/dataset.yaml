train_manifest: /home/rvm/datasets/train_manifest.csv
test_manifest: /home/rvm/datasets/test_manifest.csv

roll_out: 16
max_stride: 0.4  # seconds
frame_size: [256, 256]

# Keyed by the `source` column in the manifest. Match the strings your
# train_ssv2_kine.csv actually uses.
sources:
  ssv2:
    mode: single
    weight: 1.0
  kinetics:
    mode: single
    weight: 1.0
  ego4d:
    mode: segment
    segment_seconds: 180
    weight: 1.0
    # max_windows: 40   # optional cap per video

# Anything not listed above.
default_source:
  mode: single
  weight: 1.0