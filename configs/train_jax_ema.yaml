seed: 42
decoder_emb_dim: 512
encoder_emb_dim: 384
model:
  variant: S
  patch_size: [1, 16, 16]
  frame_size: [256, 256]   # must match dataset.frame_size so H/patch, W/patch are integer grids
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 8
  dec_heads: 16
  dec_mlp: 2048
  masking_ratio: 0.95
  max_delta: 64
  dtype: bfloat16

dataset:
  train:
    video_csv: /home/rvm/datasets/ssv2/train.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 64
    frame_size: [256, 256]
    min_duration_sec: 4
  eval:
    video_csv: /home/rvm/datasets/ssv2/test.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 64
    frame_size: [256, 256]
    min_duration_sec: 4

dataloader:
  batch_size: 16
  num_workers: 4

trainer:
  checkpoint_dir: checkpoints_ema_jax
  init_params_path: /home/rvm/rvm_ckpts/pretrain_rvm_small16_256_204031069.npz
  lr: 1.5e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  num_epochs: 2
  warmup_steps: 500
  min_lr: 1e-6
  norm_pix: false
  ema_momentum: 0.998
  ema_update_every: 1
  log_interval: 100
