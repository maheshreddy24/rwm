seed: 42
decoder_emb_dim: 512
encoder_emb_dim: 384
model:
  variant: S
  patch_size: [1, 16, 16]
  frame_size: [256, 256]   # must match dataset.frame_size so H/patch, W/patch are integer grids
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 8
  dec_heads: 16
  dec_mlp: 2048
  masking_ratio: 0.95
  max_delta: 48
  dtype: bfloat16

dataset:
  train:
    video_csv: /home/rvm/datasets/train_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 48
    frame_size: [256, 256]
    min_duration_sec: 4
  eval:
    video_csv: /home/rvm/datasets/test_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 2
    max_delta: 48
    frame_size: [256, 256]
    min_duration_sec: 4

dataloader:
  batch_size: 16
  num_workers: 8

trainer:
  checkpoint_dir: checkpoints_ema_jax
  init_params_path: /home/rvm/rvm_ckpts/pretrain_rvm_small16_256_204031069.npz

  # budget: batch_size (above) x grad_accum = 32 x 4 = 128 effective; ~1M examples
  grad_accum: 4

  # optimizer (AdamW, MAE-lineage defaults)
  lr_peak: 5.0e-5                 # SWEEP THIS on run B first
  lr_min: 5.0e-7                  # cosine floor, 1% of peak
  betas: [0.9, 0.95]              # not 0.999 -- MAE family uses 0.95
  eps: 1.0e-8
  weight_decay: 0.05
  wd_skip: [bias, norm, cls_token, pos_embed]
  grad_clip: 1.0

  # schedule (cosine + warmup)
  warmup_ratio: 0.05              # 1500 of the 30000 batches

  # EMA teacher: momentum ramps cosine from ema_momentum to ema_momentum_end over the run
  ema_momentum: 0.999
  ema_momentum_end: 0.9999
  ema_ramp: cosine
  ema_dtype: float32

  # objective: masked L2 between student representation and instance-normalized
  # (layernorm, no affine) EMA-teacher representation -- see representation_loss()
  loss_on_masked_only: true

  log_interval: 100
  eval_interval: 1000
