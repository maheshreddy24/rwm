seed: 42
decoder_emb_dim: 512
encoder_emb_dim: 384
model:
  variant: S
  patch_size: [1, 16, 16]
  frame_size: [256, 256]   # must match dataset.frame_size so H/patch, W/patch are integer grids
  core_layers: 4
  core_heads: 8
  dec_dim: 512
  dec_layers: 8
  dec_heads: 16
  dec_mlp: 2048
  masking_ratio: 0.95
  max_delta: 48
  dtype: bfloat16

# train_csv = "/home/geometric-ssl/dataset/somethingv2/20b_ssv2_train.csv"
# test_csv = "/home/geometric-ssl/dataset/somethingv2/20b_ssv2_test.csv"
#
dataset:
  train:
    video_csv: /home/rvm/datasets/train_dataset_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 4
    max_delta: 48
    frame_size: [256, 256]
    min_duration_sec: 4
  eval:
    video_csv: /home/rvm/datasets/test_dataset_ssv2_kine.csv
    num_source_frames: 4
    num_target_frames: 4
    max_delta: 48
    frame_size: [256, 256]
    min_duration_sec: 4

dataloader:
  batch_size: 32
  num_workers: 16

trainer:
  checkpoint_dir: checkpoints_pixel_recon
  init_params_path: /home/rvm/rvm_ckpts/pretrain_rvm_small16_256_204031069.npz
  lr: 1.5e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  eps: 1e-8
  grad_clip_norm: 1.0
  epochs: 100
  warmup_ratio: 0.05
  min_lr: 1e-6
  masked_only: false
  norm_pix: false
  log_interval: 100
  save_interval: 2000
